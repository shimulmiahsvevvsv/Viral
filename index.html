<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Full Video</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 14px;color:#fff;
  background:linear-gradient(125deg,#111827,#312e81,#0f766e,#581c87);
  background-size:400% 400%;animation:bgMove 24s ease infinite;
  overflow-x:hidden;
}
.wrapper{width:100%;max-width:720px;text-align:center;position:relative;z-index:1}
.tag{font-size:12px;letter-spacing:3px;font-weight:700;opacity:.85;margin-bottom:14px}
h1{font-size:clamp(24px,5vw,38px);line-height:1.2;margin:0 0 22px;font-weight:800}
.video-box{
  position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
  border-radius:18px;cursor:pointer;background:#111827;
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 18px 55px rgba(0,0,0,.35);
}
.thumbnail{width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:78px;height:78px;border-radius:50%;display:grid;place-items:center;
  background:#fff;color:#312e81;box-shadow:0 0 0 0 rgba(255,255,255,.4);
  animation:pulse 2.2s infinite;transition:transform .2s ease;
}
.play svg{width:32px;height:32px;fill:currentColor;margin-left:5px}
.watch-btn{
  width:100%;min-height:62px;margin-top:23px;border:0;border-radius:15px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:15px 18px;color:#fff;font-size:17px;font-weight:800;
  cursor:pointer;background:linear-gradient(100deg,#f97316,#ec4899,#8b5cf6);
  background-size:200% 100%;animation:buttonMove 4s ease infinite,glow 2.8s ease-in-out infinite;
  transition:transform .2s ease;
}
.watch-btn svg{width:22px;height:22px;fill:currentColor;flex-shrink:0}
.sub{font-size:12px;opacity:.7;margin-top:14px}
.video-box:focus-visible,.watch-btn:focus-visible{outline:3px solid #fef08a;outline-offset:4px}
@media(hover:hover) and (pointer:fine){
  .watch-btn:hover{transform:translateY(-3px) scale(1.01)}
  .video-box:hover .play{transform:translate(-50%,-50%) scale(1.08)}
}
@media(prefers-reduced-motion:reduce){
  body,.play,.watch-btn{animation:none}
}
@keyframes bgMove{0%,100%{background-position:0% 50%}25%{background-position:100% 0%}50%{background-position:100% 100%}75%{background-position:0% 100%}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.3)}50%{box-shadow:0 0 0 15px rgba(255,255,255,0)}}
@keyframes buttonMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes glow{0%,100%{box-shadow:0 10px 30px rgba(236,72,153,.3)}50%{box-shadow:0 10px 42px rgba(236,72,153,.65)}}
</style>
</head>
<body>
<div class="wrapper">
  <div class="tag">▶ FEATURED VIDEO</div>
  <h1>Watch This Amazing Full Video</h1>

  <div class="video-box" id="videoBox" role="button" tabindex="0" aria-label="Watch full video">
    <img class="thumbnail"
      src="https://i.imgur.com/bs5tR9b.jpeg?auto=format&fit=crop&w=1400&q=85"
      alt="Video thumbnail">
    <div class="overlay"></div>
    <div class="play" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
  </div>

  <button class="watch-btn" id="watchBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <span>WATCH FULL VIDEO</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h12m-5-5 5 5-5 5"/>
    </svg>
  </button>

  <div class="sub">Tap to watch • Full video available</div>
</div>

<script>
(function(){
  // CHANGE ONLY THIS LINK:
  const REDIRECT_URL = "https://bejewelled-kashata-a36bad.netlify.app/";

  function redirectUser(){
    if(REDIRECT_URL === "https://bejewelled-kashata-a36bad.netlify.app/"){
      alert("Please replace the demo link in the HTML code.");
      return;
    }
    window.location.href = REDIRECT_URL;
  }

  const videoBox = document.getElementById("videoBox");
  const watchBtn = document.getElementById("watchBtn");

  videoBox.addEventListener("click", redirectUser);
  watchBtn.addEventListener("click", redirectUser);

  videoBox.addEventListener("keydown", function(event){
    if(event.key === "Enter" || event.key === " "){
      event.preventDefault();
      redirectUser();
    }
  });
})();
</script>
</body>
</html>
